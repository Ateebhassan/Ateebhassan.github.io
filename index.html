<style>
/* Layout: cyan sky band at the top, round photo sitting on its edge, three link buttons below */
:root{
  --accent:#1DAFC4; --accent-deep:#0a7d8e; --on-accent:#03282e;
  --bg:#f4fbfc; --card:#ffffff; --ink:#0b2a31; --muted:#56717a; --line:#d4e9ed;
  --sky:linear-gradient(160deg,#1DAFC4 0%,#62cfdd 55%,#bfeef4 100%);
  --display:"Sora","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#06191d; --card:#0d262c; --ink:#e6f6f8; --muted:#8fb0b7; --line:#18383f;
  --accent-deep:#5fd3e3;
  --sky:linear-gradient(160deg,#0c6f7d 0%,#11909f 55%,#06191d 100%);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh}
.sky{height:150px;background:var(--sky);border-radius:0 0 50% 50% / 0 0 36px 36px}
main{max-width:440px;margin:-74px auto 0;
  padding-left:max(18px, env(safe-area-inset-left, 0px));
  padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;display:flex;flex-direction:column;gap:28px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.photo{width:136px;height:136px;border-radius:50%;object-fit:cover;display:block;
  border:5px solid var(--bg);box-shadow:0 10px 30px rgba(29,175,196,.35)}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:12px 0 0;text-wrap:balance}
.role{margin:0;color:var(--muted)}
.handle{font-size:13px;font-weight:600;color:var(--accent-deep);letter-spacing:.02em}

.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.links a{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--card);
  border:1.5px solid var(--line);border-radius:18px;color:var(--ink);text-decoration:none;font-weight:600;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.links a:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px rgba(29,175,196,.18)}
.links a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:rgba(29,175,196,.12);color:var(--accent-deep)}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.txt small{font-weight:400;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.go{color:var(--muted);font-size:18px}
.links a.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.links a.main .ico{background:rgba(255,255,255,.35);color:var(--on-accent)}
.links a.main small,.links a.main .go{color:var(--on-accent);opacity:.8}

footer{text-align:center;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.links a{transition:none}.links a:hover{transform:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <header class="profile">
    <img class="photo" src="ateeb.jpg" alt="Ateeb Hassan" width="136" height="136">
    <h1>Ateeb Hassan</h1>
    <p class="role">Content creator · Social media &amp; video</p>
    <span class="handle">@ateeb.hsn</span>
  </header>

  <ul class="links">
    <li><a class="main" href="https://wa.me/923070797412" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-13.4 7.8L3 21l1.2-4.5A9 9 0 1 1 21 12z"/><path d="M8.6 9.2c.4 2.7 3.2 5.5 5.9 5.9l1.4-1.4 2 1"/></svg></span>
      <span class="txt">WhatsApp<small>0307 0797412</small></span><span class="go">→</span></a></li>
    <li><a href="https://instagram.com/ateeb.hsn" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></span>
      <span class="txt">Instagram<small>@ateeb.hsn</small></span><span class="go">→</span></a></li>
    <li><a href="mailto:ateeb.hassan01@gmail.com">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg></span>
      <span class="txt">Email<small>ateeb.hassan01@gmail.com</small></span><span class="go">→</span></a></li>
  </ul>

  <footer>© 2026 Ateeb Hassan</footer>

</body>
</html>
